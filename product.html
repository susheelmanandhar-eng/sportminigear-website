<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Product — Sport Mini Gear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">SPORT MINI <span>GEAR</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Shop</a>
      <a href="cart.html">Cart</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="cart-link">Cart <span class="cart-count" data-cart-count>0</span></a>
      <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    </div>
  </div>
</header>

<section class="section" id="product-section">
  <div class="wrap">
    <a href="products.html" class="back-link">← Back to all products</a>
    <div id="product-content"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-grid">
      <div>
        <h4>Sport Mini Gear</h4>
        <p>Kathmandu, Nepal</p>
        <p id="footer-pan"></p>
      </div>
      <div>
        <h4>Shop</h4>
        <a href="products.html">All products</a>
        <a href="cart.html">Cart</a>
        <a href="checkout.html">Checkout</a>
      </div>
      <div>
        <h4>Get in touch</h4>
        <a id="footer-whatsapp" href="#">WhatsApp</a>
        <a id="footer-email" href="#">Email</a>
        <a href="contact.html">Contact page</a>
      </div>
      <div id="footer-social-col" style="display:none;">
        <h4>Follow us</h4>
        <a id="footer-facebook" href="#" style="display:none;">Facebook</a>
        <a id="footer-instagram" href="#" style="display:none;">Instagram</a>
        <a id="footer-tiktok" href="#" style="display:none;">TikTok</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© <span id="footer-year"></span> Sport Mini Gear. All rights reserved.</span>
      <span>www.sportminigear.com</span>
    </div>
  </div>
</footer>
<script src="js/products-data.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const product = PRODUCTS.find((p) => p.id === id);
  const contentEl = document.getElementById("product-content");

  let qty = 1;

  function render() {
    if (!product) {
      contentEl.innerHTML = `<div class="empty-state">We couldn't find that product. <a href="products.html">Browse the catalog</a> instead.</div>`;
      return;
    }
    document.getElementById("page-title").textContent = product.name + " — Sport Mini Gear";

    const maxQty = getStock(product);
    const images = getProductImages(product);
    const mainImage = images[0] || "";
    const oldPrice = product.oldPrice ? `<span class="price-old">${formatRs(product.oldPrice)}</span>` : "";
    let stockLabel;
    if (maxQty <= 0) {
      stockLabel = `<span class="stock-tag out">Out of stock</span>`;
    } else if (maxQty !== Infinity && maxQty <= 5) {
      stockLabel = `<span class="stock-tag" style="color:var(--danger);">Only ${maxQty} left in stock</span>`;
    } else {
      stockLabel = `<span class="stock-tag">In stock</span>`;
    }

    const thumbsHTML = images.length > 1
      ? `<div class="detail-gallery-thumbs">
          ${images.map((src, i) => `
            <div class="gallery-thumb ${i === 0 ? "active" : ""}" data-src="${src}">
              <img src="${src}" alt="${product.name} photo ${i + 1}"
                   onerror="this.closest('.gallery-thumb').style.display='none'" />
            </div>
          `).join("")}
        </div>`
      : "";

    contentEl.innerHTML = `
      <div class="product-detail">
        <div>
          <div class="detail-thumb product-thumb" id="main-photo">
            <img src="${mainImage}" alt="${product.name}" onerror="this.closest('.product-thumb').classList.add('img-fallback')" />
            <span class="thumb-fallback" style="font-size:3rem;">${getInitials(product.name)}</span>
          </div>
          ${thumbsHTML}
        </div>
        <div class="detail-info">
          <span class="product-cat">${product.category}</span>
          <h1>${product.name}</h1>
          <div class="detail-price">
            <span class="price">${formatRs(product.price)}</span>
            ${oldPrice}
          </div>
          <p>${product.description}</p>
          ${stockLabel}
          <div class="qty-row">
            <div class="qty-control">
              <button id="qty-minus">−</button>
              <span id="qty-value">1</span>
              <button id="qty-plus">+</button>
            </div>
          </div>
          <div class="detail-actions">
            <button class="btn btn-primary" id="add-btn" ${maxQty > 0 ? "" : "disabled"}>
              ${maxQty > 0 ? "Add to cart" : "Out of stock"}
            </button>
            <a href="cart.html" class="btn btn-outline">View cart</a>
          </div>
        </div>
      </div>
    `;

    document.getElementById("qty-minus").addEventListener("click", () => {
      qty = Math.max(1, qty - 1);
      document.getElementById("qty-value").textContent = qty;
    });
    document.querySelectorAll(".gallery-thumb").forEach((thumb) => {
      thumb.addEventListener("click", () => {
        const src = thumb.dataset.src;
        const mainPhoto = document.getElementById("main-photo");
        mainPhoto.classList.remove("img-fallback");
        mainPhoto.querySelector("img").src = src;
        document.querySelectorAll(".gallery-thumb").forEach((t) => t.classList.remove("active"));
        thumb.classList.add("active");
      });
    });
    document.getElementById("qty-plus").addEventListener("click", () => {
      qty = Math.min(maxQty, qty + 1);
      document.getElementById("qty-value").textContent = qty;
    });
    const addBtn = document.getElementById("add-btn");
    if (addBtn) {
      addBtn.addEventListener("click", () => {
        const added = addToCart(product.id, qty);
        addBtn.textContent = added > 0 ? "Added ✓" : "Limit reached";
        setTimeout(() => (addBtn.textContent = "Add to cart"), 1200);
      });
    }
  }

  render();
  document.getElementById("footer-year").textContent = new Date().getFullYear();
</script>
</body>
</html>
